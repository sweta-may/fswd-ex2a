<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiceHub | Order Confirmed</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a href="index.html" class="brand">

            <span class="brand-mark">
                S
            </span>

            <span>
                SpiceHub
            </span>

        </a>

    </div>

</header>


<main class="success-page">

    <div class="success-box">

        <div class="success-circle">
            ✓
        </div>


        <p class="eyebrow orange">
            ORDER CONFIRMED
        </p>


        <h1>
            Your food is on the way!
        </h1>


        <p class="success-message">

            Thank you for ordering from Spice Garden.
            Your order has been received and the restaurant
            has started preparing it.

        </p>


        <div class="order-id">

            <span>
                Order ID
            </span>

            <strong id="orderId">
                #SP000000
            </strong>

        </div>


        <div class="delivery-card">

            <div class="delivery-icon">
                🛵
            </div>

            <div>

                <span>
                    Estimated delivery
                </span>

                <strong>
                    30–35 minutes
                </strong>

            </div>

        </div>


        <div class="success-details">

            <div>

                <span>
                    Restaurant
                </span>

                <strong>
                    Spice Garden
                </strong>

            </div>


            <div>

                <span>
                    Payment
                </span>

                <strong id="paymentMethod">
                    UPI
                </strong>

            </div>


            <div>

                <span>
                    Total
                </span>

                <strong>
                    ₹<span id="orderTotal">0</span>
                </strong>

            </div>

        </div>


        <a
            href="index.html"
            class="primary-button"
        >
            Order more food
        </a>

    </div>

</main>


<script>

const order =
    JSON.parse(
        localStorage.getItem("lastOrder")
    );

if (order) {

    document.getElementById("orderId")
        .textContent = order.id;

    document.getElementById("paymentMethod")
        .textContent = order.payment;

    document.getElementById("orderTotal")
        .textContent = order.total;

}

</script>

</body>
</html>
